services:
  tunnel2tunnel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_TIME: ${BUILD_TIME:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-}
        BUILD_BUGSINK_URL: ${BUILD_BUGSINK_URL:-}
        BUILD_BUGSINK_AUTH_TOKEN: ${BUILD_BUGSINK_AUTH_TOKEN:-}
        BUILD_BUGSINK_PROJECT_SLUG: ${BUILD_BUGSINK_PROJECT_SLUG:-}
    environment:
      SERVICE_FQDN_TUNNEL2TUNNEL_3000: ${SERVICE_FQDN_TUNNEL2TUNNEL_3000}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-t2t}:${SERVICE_PASSWORD_POSTGRES}@db:5432/tunnel2tunnel
      HTTP_PORT: "3000"
      SSH_PORT: "${SSH_PORT:-2222}"
      ADMIN_USERNAME: ${SERVICE_USER_ADMIN:-admin}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      STATIC_DIR: /app/frontend/dist
      RUST_LOG: ${RUST_LOG:-info}
      SSH_HOST_KEY_PATH: /data/ssh_host_key
      SSH_T2T_KEY_PASSWORD: ${SERVICE_PASSWORD_T2TKEY}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      BUILD_TIME: ${BUILD_TIME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    volumes:
      - t2t_data:/data
    ports:
      - "${SSH_PORT:-2222}:${SSH_PORT:-2222}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-t2t}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: tunnel2tunnel
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pg_data:
  t2t_data:
