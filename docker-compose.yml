services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tunnel2tunnel
      POSTGRES_USER: t2t
      POSTGRES_PASSWORD: t2t_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2t -d tunnel2tunnel"]
      interval: 5s
      timeout: 5s
      retries: 10

  t2t:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://t2t:t2t_secret@db/tunnel2tunnel
      HTTP_PORT: "3000"
      SSH_PORT: "2222"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      RUST_LOG: info
      SSH_HOST_KEY_PATH: /data/ssh_host_key
      SSH_T2T_KEY_PASSWORD: ${SSH_T2T_KEY_PASSWORD:-}
    volumes:
      - t2t_data:/data
    ports:
      - "3000:3000"
      - "2222:2222"

volumes:
  pg_data:
  t2t_data:
