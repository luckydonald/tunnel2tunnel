services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tunnel2tunnel
      POSTGRES_USER: t2t
      POSTGRES_PASSWORD: t2t_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2t -d tunnel2tunnel"]
      interval: 5s
      timeout: 5s
      retries: 10

  t2t:
    build:
      context: .
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        NODE_MAX_OLD_SPACE_MB: ${NODE_MAX_OLD_SPACE_MB:-2048}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_TIME: ${BUILD_TIME:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-}
        BUILD_BUGSINK_URL: ${BUILD_BUGSINK_URL:-}
        BUILD_BUGSINK_AUTH_TOKEN: ${BUILD_BUGSINK_AUTH_TOKEN:-}
        BUILD_BUGSINK_PROJECT_SLUG: ${BUILD_BUGSINK_PROJECT_SLUG:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://t2t:t2t_secret@db/tunnel2tunnel
      HTTP_PORT: "3000"
      SSH_PORT: "2222"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      RUST_LOG: info
      SSH_HOST_KEY_PATH: /data/ssh_host_key
      SSH_T2T_KEY_PASSWORD: ${SSH_T2T_KEY_PASSWORD:-}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      BUILD_TIME: ${BUILD_TIME:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    volumes:
      - t2t_data:/data
    ports:
      - "3000:3000"
      - "2222:2222"

volumes:
  pg_data:
  t2t_data:
