[workspace]
members = [
    "crates/t2t-feasibility",
    "crates/tunnel2tunnel-core",
    "crates/tunnel2tunnel-web",
    "crates/tunnel2tunnel-ssh",
    "crates/t2t",
]
resolver = "2"

[workspace.dependencies]
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx        = { version = "0.8",  features = ["postgres", "uuid", "time", "runtime-tokio"] }
uuid        = { version = "1",    features = ["v7", "serde"] }
time        = { version = "0.3",  features = ["serde", "serde-well-known"] }
sha2        = "0.10"
base64      = "0.22"
axum        = { version = "0.8",  features = ["ws"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tower-http  = { version = "0.7",  features = ["fs"] }
argon2      = "0.5"
russh       = "0.61"
getrandom   = "0.4"
ipnetwork   = "0.20"
glob        = "0.3"
regex       = "1"
sentry      = { version = "0.48.3", default-features = false, features = ["backtrace", "contexts", "panic", "transport"] }
tower       = "0.5"

[profile.release]
strip = true          # smaller binary, less to page in on a memory-constrained VPS
opt-level = "s"       # this is an I/O-bound proxy, not CPU-bound; "s" also uses less peak RAM to compile than "3"
lto = false           # explicitly off — fat/thin LTO's whole-program link step is the single biggest RAM spike in a
                       # release build and would blow the build-time budget on a <200MB VPS; not worth the size gain
codegen-units = 1     # CARGO_BUILD_JOBS=1 (set in the Dockerfile) only serializes which crate rustc compiles at a
                       # time — a single rustc invocation still runs its codegen units in parallel threads by
                       # default (16 for release), each holding its own LLVM context in memory. Forcing 1 caps
                       # that per-crate parallel memory spike too, at the cost of slower builds.
